name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bridge-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Bridge/package-lock.json
      - run: npm ci --prefix Bridge --ignore-scripts
      - run: npm test --prefix Bridge
